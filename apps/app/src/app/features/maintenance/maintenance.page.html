<main class="mx-auto flex min-h-screen max-w-md flex-col items-center justify-center gap-4 px-6 text-center">
  <h1 class="text-2xl font-semibold">{{ 'maintenance.pageTitle' | transloco }}</h1>
  <p class="text-muted-foreground text-sm">{{ 'errors.MAINTENANCE_MODE' | transloco }}</p>

  <button hlmBtn type="button" [disabled]="checking()" (click)="retry()">
    {{ (checking() ? 'maintenance.checking' : 'maintenance.retry') | transloco }}
  </button>

  @if (stillClosed()) {
  <p class="text-muted-foreground text-xs" role="status">{{ 'maintenance.stillClosed' | transloco }}</p>
  }
</main>
