  <nav class="flex flex-wrap gap-3 text-sm">

      routerLinkActive="font-medium text-foreground"
      class="text-muted-foreground underline underline-offset-4"
      *appCanPlatform="['platform.users.read']"
    >
      {{ 'admin.users' | transloco }}

    <a
      routerLink="/admin/organizations"

    <a

    <a
      routerLink="/admin/maintenance"
