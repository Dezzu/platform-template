<section hlmCard class="w-full max-w-sm">
  <div hlmCardHeader>
    <h1 hlmCardTitle>{{ appName }}</h1>
    <p hlmCardDescription>{{ 'auth.resetPasswordTitle' | transloco }}</p>
  </div>

  @if (!token) {
  <div hlmCardContent>
    <p class="text-destructive text-sm" role="alert">{{ 'auth.resetLinkMissing' | transloco }}</p>
  </div>
  } @else {
  <form hlmCardContent class="space-y-4" (submit)="submit($event)">
    <dui-password-input
      autocompleteHint="new-password"
      [label]="'auth.newPassword' | transloco"
      [formField]="reset.password"
    />

    <dui-password-input
      autocompleteHint="new-password"
      [label]="'auth.confirmPassword' | transloco"
      [formField]="reset.confirmation"
    />

    @if (passwordsMismatch()) {
    <p class="text-destructive text-sm" role="alert">{{ 'form.passwordMismatch' | transloco }}</p>
    } @if (errorKey(); as key) {
    <p class="text-destructive text-sm" role="alert">{{ key | transloco }}</p>
    }

    <button hlmBtn type="submit" class="w-full" [disabled]="submitting()">
      {{ (submitting() ? 'auth.saving' : 'auth.setNewPassword') | transloco }}
    </button>
  </form>
  }

  <div hlmCardFooter>
    <a routerLink="/sign-in" class="text-muted-foreground text-sm underline underline-offset-4">
      {{ 'auth.backToSignIn' | transloco }}
    </a>
  </div>
</section>
