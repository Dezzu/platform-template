<section hlmCard class="w-full max-w-sm">
  <div hlmCardHeader>
    <h1 hlmCardTitle>{{ appName }}</h1>
    <p hlmCardDescription>{{ 'auth.signUpTitle' | transloco }}</p>
  </div>

  <form hlmCardContent class="space-y-4" (submit)="signUp($event)">
    <dui-text-input autocomplete="on" [label]="'auth.name' | transloco" [formField]="registration.name" />

    <dui-text-input
      type="email"
      autocomplete="on"
      [label]="'auth.email' | transloco"
      [formField]="registration.email"
    />

    <div class="space-y-1">
      <dui-password-input
        autocompleteHint="new-password"
        [label]="'auth.password' | transloco"
        [formField]="registration.password"
      />
      <p class="text-muted-foreground text-xs">{{ 'auth.passwordHint' | transloco }}</p>
    </div>

    <div class="space-y-1">
      <dui-password-input
        autocompleteHint="new-password"
        [label]="'auth.confirmPassword' | transloco"
        [formField]="registration.confirmPassword"
      />
      @if (passwordsMismatch()) {
      <p class="text-destructive text-sm" role="alert">{{ 'form.passwordMismatch' | transloco }}</p>
      }
    </div>

    @if (errorKey(); as key) {
    <p class="text-destructive text-sm" role="alert">{{ key | transloco }}</p>
    }

    <button hlmBtn type="submit" class="w-full" [disabled]="submitting()">
      {{ (submitting() ? 'auth.signingUp' : 'auth.signUp') | transloco }}
    </button>
  </form>

  <div hlmCardFooter class="flex-col gap-3">
    <button hlmBtn variant="outline" class="w-full" type="button" (click)="signUpWithGoogle()">
      {{ 'auth.withGoogle' | transloco }}
    </button>

    <p class="text-muted-foreground text-sm">
      {{ 'auth.haveAccount' | transloco }}
      <a routerLink="/sign-in" class="text-foreground font-medium underline underline-offset-4">
        {{ 'auth.signIn' | transloco }}
      </a>
    </p>
  </div>
</section>
