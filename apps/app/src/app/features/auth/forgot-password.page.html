<section hlmCard class="w-full max-w-sm">
  <div hlmCardHeader>
    <h1 hlmCardTitle>{{ appName }}</h1>
    <p hlmCardDescription>{{ 'auth.forgotPasswordTitle' | transloco }}</p>
  </div>

  @if (sent()) {
  <div hlmCardContent class="space-y-4">
    <p class="text-sm" role="status">{{ 'auth.resetLinkSent' | transloco }}</p>
  </div>
  } @else {
  <form hlmCardContent class="space-y-4" (submit)="send($event)">
    <p class="text-muted-foreground text-sm">{{ 'auth.forgotPasswordHint' | transloco }}</p>

    <dui-text-input type="email" autocomplete="on" [label]="'auth.email' | transloco" [formField]="request.email" />

    <button hlmBtn type="submit" class="w-full" [disabled]="submitting()">
      {{ (submitting() ? 'auth.sending' : 'auth.sendResetLink') | transloco }}
    </button>
  </form>
  }

  <div hlmCardFooter>
    <a routerLink="/sign-in" class="text-muted-foreground text-sm underline underline-offset-4">
      {{ 'auth.backToSignIn' | transloco }}
    </a>
  </div>
</section>
