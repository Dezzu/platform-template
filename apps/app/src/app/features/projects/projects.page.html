<h1 class="mb-1 text-2xl font-semibold">{{ 'nav.projects' | transloco }}</h1>
<p class="text-muted-foreground mb-6 text-sm">{{ 'projects.description' | transloco }}</p>

@if (failed()) {
<p class="text-destructive mb-4 text-sm" role="alert">{{ 'errors.INTERNAL_ERROR' | transloco }}</p>
}

<dui-table
  dataKey="id"
  emptyMessage="common.empty"
  [cols]="columns()"
  [items]="rows()"
  [actions]="actions()"
  [actionsAsMenu]="true"
  [lazy]="true"
  [loading]="loading()"
  [totalRecords]="total()"
  [showAddButton]="mayCreate()"
  (onLazyLoad)="onLazyLoad($event)"
  (openNew)="openNew()"
>
  <ng-template duiTemplate="description" let-value>
    @if (value) {
    <span class="text-muted-foreground">{{ value }}</span>
    } @else {
    <span class="text-muted-foreground">—</span>
    }
  </ng-template>

  <!--
    A status is a small closed set, so it reads as a badge rather than as a word in a
    column of words: the eye finds "archiviato" among twenty rows without reading them.
  -->
  <ng-template duiTemplate="status" let-item="item">
    @let project = asProject(item);
    <span
      class="rounded-full px-2 py-0.5 text-xs font-medium"
      [class]="
        project.status === 'active'
          ? 'bg-green-100 text-green-900 dark:bg-green-900/40 dark:text-green-100'
          : 'bg-muted text-muted-foreground'
      "
    >
      {{ 'projects.status.' + project.status | transloco }}
    </span>
  </ng-template>
</dui-table>
