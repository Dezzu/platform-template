<app-admin-nav />
<p class="text-muted-foreground mb-6 text-sm">{{ 'flags.description' | transloco }}</p>

@if (failed()) {
<p class="text-destructive mb-4 text-sm" role="alert">{{ 'errors.INTERNAL_ERROR' | transloco }}</p>
}

<dui-table
  dataKey="key"
  emptyMessage="common.empty"
  [cols]="columns()"
  [items]="rows()"
  [actions]="actions()"
  [actionsAsMenu]="true"
  [lazy]="true"
  [loading]="loading()"
  [totalRecords]="total()"
  [showAddButton]="true"
  (onLazyLoad)="onLazyLoad($event)"
  (openNew)="openNew()"
>
  <ng-template duiTemplate="description" let-value>
    @if (value) {
    <span class="text-muted-foreground">{{ value }}</span>
    } @else {
    <span class="text-muted-foreground">—</span>
    }
  </ng-template>

  <!--
    Un badge e basta: il flag è acceso o spento, e non c'è più una percentuale o un
    elenco di eccezioni che possa contraddire quello che dice.
  -->
  <ng-template duiTemplate="state" let-item="item">
    @let flag = asFlag(item);
    <span
      class="rounded-full px-2 py-0.5 text-xs font-medium"
      [class]="
        flag.enabled
          ? 'bg-green-100 text-green-900 dark:bg-green-900/40 dark:text-green-100'
          : 'bg-muted text-muted-foreground'
      "
    >
      {{ (flag.enabled ? 'flags.on' : 'flags.off') | transloco }}
    </span>
  </ng-template>
</dui-table>
